<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macropad Studio</title>
<style>
:root{
  --bg:#0b0d10; --panel:#13161b; --panel2:#181c22; --line:#242a32; --line2:#2e3540;
  --text:#e7eaee; --muted:#8b94a0; --faint:#5d6672;
  --accent:#20d3ff; --accent2:#7c5cff; --ok:#3ddc84; --warn:#ffb020; --bad:#ff5468;
  --radius:12px;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%, #17202b 0%, var(--bg) 60%) fixed, var(--bg);
  color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ---------- top bar ---------- */
header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);
  background:rgba(11,13,16,.7);backdrop-filter:blur(10px);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.06em}
.brand .logo{width:26px;height:26px;border-radius:7px;background:conic-gradient(from 210deg,var(--accent),var(--accent2),var(--accent));
  box-shadow:0 0 18px rgba(32,211,255,.45)}
.brand small{font-weight:500;color:var(--muted);letter-spacing:.02em}
.spacer{flex:1}
.conn{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:999px}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.conn.on i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:7px 12px;font-weight:550;transition:.15s}
.btn:hover{border-color:#3d4654;background:#1d222a}
.btn.primary{background:linear-gradient(180deg,#25d8ff,#14b4e0);color:#03141a;border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary.dirty{box-shadow:0 0 0 3px rgba(32,211,255,.25),0 0 20px rgba(32,211,255,.35)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--panel2)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:260px minmax(520px,1fr) 390px;gap:16px;padding:16px 20px;max-width:1600px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.panel h3{margin:0;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:650}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.pb{padding:12px 14px}
@media (max-width:1180px){main{grid-template-columns:1fr}}

/* ---------- left: layers / combos ---------- */
.layer-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.layer-item:hover{background:var(--panel2)}
.layer-item.active{background:linear-gradient(90deg,rgba(32,211,255,.12),transparent);border-color:rgba(32,211,255,.35)}
.layer-item .dot{width:10px;height:10px;border-radius:50%;flex:none}
.layer-item .thumb{width:48px;height:12px;image-rendering:pixelated;background:#000;border-radius:2px;flex:none}
.layer-item .nm{flex:1;font-weight:600;font-size:13px;letter-spacing:.04em}
.layer-item .idx{font:11px var(--mono);color:var(--faint)}
.combo-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;cursor:pointer;margin-bottom:4px;border:1px solid transparent;font-size:13px}
.combo-item:hover{background:var(--panel2)}
.combo-item.active{border-color:rgba(124,92,255,.5);background:rgba(124,92,255,.1)}
.chipset{display:flex;gap:3px;align-items:center}
.kchip{font:11px var(--mono);background:#232831;border:1px solid var(--line2);border-radius:5px;padding:1px 5px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px}
.row{display:flex;align-items:center;gap:8px}
.stack>*+*{margin-top:10px}

/* ---------- center: device ---------- */
.stage{display:flex;flex-direction:column;align-items:center;padding:18px 18px 8px}
.modebar{display:flex;gap:4px;padding:4px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;margin-bottom:18px}
.modebar button{border:0;background:transparent;padding:7px 16px;border-radius:8px;color:var(--muted);font-weight:600}
.modebar button.on{background:#232a33;color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.modebar button.on.try{background:linear-gradient(180deg,rgba(61,220,132,.22),rgba(61,220,132,.1));color:#bff5d6;box-shadow:inset 0 0 0 1px rgba(61,220,132,.45)}

.device{position:relative;width:min(440px,100%);padding:26px 26px 30px;border-radius:30px;
  background:linear-gradient(160deg,#262a31 0%,#17191d 55%,#121417 100%);
  box-shadow:0 30px 60px rgba(0,0,0,.55),0 2px 0 rgba(255,255,255,.06) inset,0 -2px 0 rgba(0,0,0,.5) inset,0 0 0 1px #2c3138}
.device::after{content:"";position:absolute;inset:8px;border-radius:24px;border:1px dashed rgba(255,255,255,.035);pointer-events:none}
.dtop{display:flex;align-items:center;gap:20px;margin-bottom:26px}
.oled{position:relative;flex:1;padding:9px;border-radius:9px;background:#050607;cursor:pointer;
  box-shadow:0 0 0 1px #2a2f36,0 0 0 4px #0d0f12,inset 0 0 12px rgba(0,0,0,.9)}
.oled canvas{display:block;width:100%;aspect-ratio:4/1;image-rendering:pixelated;filter:drop-shadow(0 0 3px rgba(150,205,255,.55))}
.oled.sel,.led.sel{box-shadow:0 0 0 2px var(--accent),0 0 18px rgba(32,211,255,.4)}
.oled .tag{position:absolute;left:10px;bottom:-19px;font:10.5px var(--mono);color:var(--faint);letter-spacing:.08em}
.knobwrap{position:relative;width:106px;height:106px;flex:none}
.knob{position:absolute;inset:10px;border-radius:50%;cursor:pointer;
  background:repeating-conic-gradient(from 0deg,#3a3f47 0 4deg,#24282e 4deg 8deg);
  box-shadow:0 8px 16px rgba(0,0,0,.6),0 0 0 1px #0c0d0f;transition:transform .22s cubic-bezier(.3,1.4,.5,1),scale .1s}
.knob::before{content:"";position:absolute;inset:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5a616b,#2a2e34 60%,#1d2025);box-shadow:inset 0 1px 1px rgba(255,255,255,.15)}
.knob::after{content:"";position:absolute;left:50%;top:14px;width:3px;height:16px;margin-left:-1.5px;border-radius:2px;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.knob.pressed{scale:.93}
.kz{position:absolute;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:var(--muted);
  background:#1b1f25;border:1px solid var(--line2);cursor:pointer;z-index:2;transition:.15s;padding:0}
.kz:hover{color:var(--text);border-color:#4a5463}
.kz.ccw{left:-12px;bottom:-6px}.kz.cw{right:-12px;bottom:-6px}
.kz.sel,.knob.sel{box-shadow:0 0 0 2px var(--accent),0 0 16px rgba(32,211,255,.5)}
.led{position:absolute;top:13px;right:30px;width:9px;height:9px;border-radius:50%;cursor:pointer;background:#222;transition:background .25s,box-shadow .25s}
.led-label{position:absolute;top:9px;right:46px;font:9.5px var(--mono);color:var(--faint);letter-spacing:.08em}

.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.key{position:relative;aspect-ratio:1;border-radius:14px;border:0;padding:10px 8px 8px;text-align:left;color:var(--text);
  background:linear-gradient(180deg,#363b43 0%,#2a2e35 100%);
  box-shadow:0 6px 0 #16181c,0 8px 14px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.09);
  display:flex;flex-direction:column;justify-content:space-between;transition:transform .07s,box-shadow .07s;user-select:none;min-width:0}
.key:hover{background:linear-gradient(180deg,#3c424b 0%,#2e333a 100%)}
.key.down{transform:translateY(5px);box-shadow:0 1px 0 #16181c,0 2px 6px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06)}
.key.sel{box-shadow:0 6px 0 #16181c,0 0 0 2px var(--accent),0 0 22px rgba(32,211,255,.45),inset 0 1px 0 rgba(255,255,255,.09)}
.key.combo-hl{box-shadow:0 6px 0 #16181c,0 0 0 2px var(--accent2),0 0 22px rgba(124,92,255,.5),inset 0 1px 0 rgba(255,255,255,.09)}
.key.picked{box-shadow:0 6px 0 #16181c,0 0 0 2px var(--warn),0 0 20px rgba(255,176,32,.45)}
.key .pos{font:10px var(--mono);color:var(--faint)}
.key .lbl{font-weight:750;font-size:15px;letter-spacing:.03em;line-height:1.1;word-break:break-word}
.key .sub{font:11px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key.empty .lbl{color:var(--faint);font-weight:500}
.key .badges{position:absolute;top:8px;right:8px;display:flex;gap:3px}
.badge{font:9.5px var(--mono);padding:1px 5px;border-radius:5px;background:#1b1e23;border:1px solid var(--line2);color:var(--muted)}
.badge.combo{border-color:rgba(124,92,255,.6);color:#b9a8ff}
.badge.hold{border-color:rgba(255,176,32,.5);color:#ffd27a}
.hint{margin:18px 0 4px;color:var(--muted);font-size:12.5px;text-align:center;max-width:460px}
.hint kbd{font:11px var(--mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:#1a1d22;color:var(--text)}

.log{margin-top:14px}
.log ul{list-style:none;margin:0;padding:0;max-height:190px;overflow:auto;font:12.5px var(--mono)}
.log li{display:grid;grid-template-columns:64px 120px 1fr;gap:10px;padding:6px 14px;border-top:1px solid var(--line)}
.log li:first-child{border-top:0;background:rgba(32,211,255,.05)}
.log .t{color:var(--faint)} .log .s{color:var(--muted)}
.log .empty{padding:14px;color:var(--faint);font:12.5px var(--mono)}

/* ---------- right: inspector ---------- */
.insp-title{display:flex;align-items:baseline;gap:10px;min-width:0}
.insp-title .big{font-size:16px;font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid var(--line2);background:var(--panel2);padding:6px 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.tab.on{color:var(--text);border-color:var(--accent);background:rgba(32,211,255,.1)}
label.f{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:650;margin-bottom:6px}
.in,select.in,textarea.in{width:100%;background:#0f1216;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;outline:none;min-width:0}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(32,211,255,.15)}
textarea.in{min-height:70px;resize:vertical}
.mods{display:flex;gap:6px}
.mod{flex:1;border:1px solid var(--line2);background:var(--panel2);border-radius:8px;padding:7px 0;text-align:center;font-weight:650}
.mod span{display:block;font-size:10px;color:var(--muted);font-weight:500}
.mod.on{border-color:var(--accent);background:rgba(32,211,255,.12);color:#c9f4ff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pick{border:1px solid var(--line2);background:var(--panel2);border-radius:8px;padding:8px;text-align:left;font-size:12.5px}
.pick:hover{border-color:#455061}
.pick.on{border-color:var(--accent);background:rgba(32,211,255,.1)}
.pick b{display:block;font-size:12.5px;font-weight:600}
.preview-line{font:12.5px var(--mono);padding:9px 11px;border-radius:8px;background:#0f1216;border:1px dashed var(--line2);color:#bfe9ff;overflow-wrap:anywhere}
.section{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;background:#0f1216;border:1px solid var(--line2);border-radius:9px;padding:8px}
.step .n{font:11px var(--mono);color:var(--faint);padding-top:8px}
.step .ctl{display:flex;flex-direction:column;gap:2px}
.step .ctl button{border:0;background:transparent;color:var(--faint);padding:0 4px;font-size:12px}
.step .ctl button:hover{color:var(--text)}
.step .stack>*+*{margin-top:6px}
.mods.compact .mod{padding:3px 0;font-size:12px}
.mods.compact .mod span{display:none}
.warn{color:var(--warn);font-size:12px}
.rec{color:#fff!important;background:var(--bad)!important;border-color:var(--bad)!important;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,84,104,.15)}}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.imgopt{border:1px solid var(--line2);border-radius:8px;padding:6px;background:#0a0c0e;cursor:pointer;text-align:center}
.imgopt.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(32,211,255,.2)}
.imgopt canvas{width:100%;aspect-ratio:4/1;image-rendering:pixelated;display:block;margin-bottom:4px}
.imgopt small{font:10.5px var(--mono);color:var(--muted)}
input[type=color]{width:42px;height:36px;padding:0;border:1px solid var(--line2);border-radius:8px;background:none}
input[type=range]{width:100%;accent-color:var(--accent)}

/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;backdrop-filter:blur(3px)}
.modal{width:min(520px,92vw);background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.notice{position:fixed;left:50%;bottom:24px;translate:-50% 0;background:#1d232b;border:1px solid var(--line2);padding:10px 16px;border-radius:10px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw}
.notice.ok{border-color:rgba(61,220,132,.5)} .notice.bad{border-color:rgba(255,84,104,.6)}
.banner{margin:12px 20px 0;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,176,32,.4);background:rgba(255,176,32,.08);color:#ffd890;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo"></div>MACROPAD STUDIO <small>XIAO RP2040 · KMK</small></div>
  <div class="spacer"></div>
  <div class="conn" id="conn"><i></i><span>Not connected</span></div>
  <button class="btn" id="btnConnect">Connect pad…</button>
  <button class="btn ghost" id="btnImport">Import</button>
  <button class="btn ghost" id="btnExport">Export</button>
  <button class="btn ghost" id="btnSettings">Settings</button>
  <button class="btn primary" id="btnSave">Save to pad</button>
</header>
<div id="banner" class="banner hidden"></div>

<main>
  <!-- left -->
  <div class="stack">
    <section class="panel">
      <div class="ph"><h3>Layers</h3><button class="btn sm" id="btnAddLayer">+ Add</button></div>
      <div class="pb" id="layerList"></div>
    </section>
    <section class="panel">
      <div class="ph"><h3>Combos</h3><button class="btn sm" id="btnAddCombo">+ New</button></div>
      <div class="pb" id="comboList"></div>
    </section>
  </div>

  <!-- center -->
  <div>
    <section class="panel">
      <div class="stage">
        <div class="modebar">
          <button id="modeEdit" class="on">Edit</button>
          <button id="modeTry">▶ Try it</button>
        </div>
        <div class="device" id="device">
          <div class="led-label">LED</div>
          <div class="led" id="led" title="Onboard NeoPixel: shows the layer color"></div>
          <div class="dtop">
            <div class="oled" id="oled" title="OLED 128×32: click to edit this layer's screen"><canvas id="oledCanvas" width="512" height="128"></canvas><div class="tag">OLED 128×32</div></div>
            <div class="knobwrap" aria-label="Encoder controls">
              <div id="knobState" class="small muted" style="position:absolute;top:-10px;white-space:nowrap"></div>
              <div class="knob" id="knob" title="Knob press"></div>
              <button class="kz ccw" id="kccw" title="Turn left">↺</button>
              <button class="kz cw" id="kcw" title="Turn right">↻</button>
            </div>
          </div>
          <div class="keys" id="keys"></div>
        </div>
        <div class="hint" id="hint"></div>
      </div>
    </section>
    <section class="panel log">
      <div class="ph"><h3>What your computer receives</h3><button class="btn sm ghost" id="btnClearLog">Clear</button></div>
      <ul id="log"></ul>
    </section>
  </div>

  <!-- right -->
  <section class="panel" id="inspector"></section>
</main>

<input type="file" id="fileImport" accept=".json,application/json" class="hidden">
<input type="file" id="fileImage" accept="image/*" class="hidden">
<div id="modalRoot"></div>
<div id="notice" class="notice hidden"></div>

<script>
'use strict';
/* ================= data ================= */

function store(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function restore(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } }

function initState(){
  const draft = restore('macropad.draft');
  S.cfg = normalize(draft && draft.cfg ? draft.cfg : clone(DEFAULT_CONFIG));
  S.dirty = !!(draft && draft.dirty);
}
function normalize(cfg){
  cfg.version = 1;
  cfg.settings = Object.assign({knob:false, hold_ms:220, combo_timeout:80, toast_ms:1200, led_brightness:0.05, dim_s:20, off_s:60}, cfg.settings||{});
  cfg.layers = (cfg.layers||[]).slice(0,8);
  if (!cfg.layers.length) cfg.layers.push(blankLayer('LAYER 1'));
  for (const L of cfg.layers){
    L.keys = (L.keys||[]).slice(0,9); while (L.keys.length < 9) L.keys.push({type:'none'});
    L.keys = L.keys.map(k => k || {type:'none'});
    L.encoder = Object.assign({ccw:{type:'none'}, cw:{type:'none'}, press:{type:'none'}}, L.encoder||{});
    if (!L.color) L.color = '#20d3ff';
    L.name = asciiOnly(L.name || 'LAYER').toUpperCase().slice(0,10);
  }
  cfg.combos = (cfg.combos||[]).filter(c => c && Array.isArray(c.keys));
  ensureLayerCombo(cfg);
  return cfg;
}
function ensureLayerCombo(cfg){
  const switchesLayer = a => !!a && (a.type==='layer' || switchesLayer(a.hold));
  const hasSwitch = cfg.layers.some(L => L.keys.some(switchesLayer)) || cfg.combos.some(c => switchesLayer(c.action));
  if (!cfg.settings.knob && !hasSwitch && !cfg.combos.some(c => [...c.keys].sort((a,b)=>a-b).join(',')==='6,8')){
    cfg.combos.push({keys:[6,8], action:{type:'layer', mode:'to', layer:'next', label:'NEXT LYR'}});
  }
}
function blankLayer(name){
  return {name, image:null, color:'#7c5cff', keys:Array.from({length:9}, () => ({type:'none'})),
    encoder:{ccw:sc('VOLD',[],'VOL-'), cw:sc('VOLU',[],'VOL+'), press:{type:'layer', mode:'to', layer:'next', label:'NEXT LYR'}}};
}
function persist(){ ensureLayerCombo(S.cfg); S.dirty = true; store('macropad.draft', {cfg:S.cfg, dirty:true}); }

/* ================= describing actions ================= */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const asciiOnly = s => String(s||'').replace(/[^\x20-\x7e]/g,'');
const sortMods = mods => MOD_ORDER.filter(m => (mods||[]).includes(m));
const modSyms = mods => sortMods(mods).map(m => MODS.find(x => x.k===m).sym).join('');
const keyShort = k => SHORT[k] || (KEY_LABEL[k] && KEY_LABEL[k].length<=3 ? KEY_LABEL[k] : (KEY_LABEL[k]||k));
const chordText = s => isMedia(s.key) ? MEDIA_MAP[s.key].l : modSyms(s.mods) + keyShort(s.key);
function layerName(t){
  if (t === 'next') return 'next layer';
  if (t === 'prev') return 'previous layer';
  return (S.cfg.layers[t]||{}).name || ('layer '+(+t+1));
}
const MODE_TXT = {to:'Switch to', mo:'While held:', tg:'Toggle', df:'Set default'};
function stepText(st){
  switch(st.do){
    case 'tap': return chordText(st);
    case 'press': return 'hold '+chordText(st);
    case 'release': return 'release '+chordText(st);
    case 'delay': return 'wait '+(st.ms||0)+'ms';
    case 'text': return '“'+(st.text||'')+'”';
  }
  return '?';
}
function describe(a){
  if (!a || a.type==='none') return 'Nothing';
  switch(a.type){
    case 'key': return chordText(a);
    case 'text': return 'Types “'+(a.text||'')+'”';
    case 'macro': return (a.steps||[]).length ? a.steps.map(stepText).join(' → ') : 'Empty macro';
    case 'layer': return MODE_TXT[a.mode||'to']+' '+layerName(a.layer);
  }
  return '?';
}
function autoLabel(a){
  if (!a || a.type==='none') return '';
  if (a.type==='key'){
    if (isMedia(a.key)) return MEDIA_MAP[a.key].s;
    const m = sortMods(a.mods).map(x => MODS.find(y=>y.k===x).ascii);
    const k = ASCII[a.key] || asciiOnly(KEY_LABEL[a.key]||a.key).toUpperCase() || a.key;
    return [...m, k].join('+').slice(0,10);
  }
  if (a.type==='text') return asciiOnly(a.text).toUpperCase().slice(0,10);
  if (a.type==='macro') return 'MACRO';
  if (a.type==='layer'){ const t = a.layer; return t==='next'?'NEXT LYR':t==='prev'?'PREV LYR':((S.cfg.layers[t]||{}).name||'LAYER').slice(0,10); }
  return '';
}
const labelOf = a => (a && a.label) || autoLabel(a);

/* ================= OLED rendering ================= */
function loadImg(path){
  if (S.imgEls[path]) return S.imgEls[path];
  const src = S.images[path]; if (!src) return null;
  const im = new Image(); im.onload = () => { renderDevice(); renderLists(); if (S.sel.kind==='layer') renderInspector(); }; im.src = src;
  S.imgEls[path] = im; return im;
}
const off = document.createElement('canvas'); off.width = 128; off.height = 32;
const offx = off.getContext('2d', {willReadFrequently:true});
function oledBits(layerIdx, toast, imageOverride){
  const L = S.cfg.layers[layerIdx]; offx.fillStyle='#000'; offx.fillRect(0,0,128,32);
  const path = imageOverride !== undefined ? imageOverride : (L && L.image);
  const im = path ? loadImg(path) : null;
  if (im && im.complete && im.naturalWidth){ offx.imageSmoothingEnabled = false; offx.drawImage(im,0,0,128,32); }
  else if (L){ offx.fillStyle='#fff'; offx.font='bold 13px Menlo, monospace'; offx.textAlign='center'; offx.textBaseline='middle'; offx.fillText((L.name||'').slice(0,10), 64, 16); }
  const d = offx.getImageData(0,0,128,32).data; const bits = new Uint8Array(128*32);
  for (let i=0;i<bits.length;i++){ const p=i*4; bits[i] = (d[p]*.3+d[p+1]*.59+d[p+2]*.11) > 127 ? 1 : 0; }
  if (toast){
    offx.fillStyle='#000'; offx.fillRect(0,0,128,32);
    offx.font='10px Menlo, monospace'; offx.textAlign='right'; offx.textBaseline='alphabetic';
    const w = Math.min(126, Math.ceil(offx.measureText(toast).width)+4), h=12, x=127-w, y=31-h;
    offx.fillStyle='#fff'; offx.fillRect(x,y,w+1,h+1); offx.fillStyle='#000'; offx.fillText(toast, 126, 30);
    const t = offx.getImageData(0,0,128,32).data;
    for (let yy=y; yy<=31; yy++) for (let xx=Math.max(0,x); xx<=127; xx++){ const i=yy*128+xx; bits[i] = t[i*4]>127?1:0; }
  }
  return bits;
}
function paintBits(canvas, bits, color='#d6ecff'){
  const c = canvas.getContext('2d'); const sx = canvas.width/128, sy = canvas.height/32;
  c.fillStyle='#000'; c.fillRect(0,0,canvas.width,canvas.height); c.fillStyle=color;
  const gap = sx >= 3 ? 0.6 : 0;
  for (let y=0;y<32;y++) for (let x=0;x<128;x++) if (bits[y*128+x]) c.fillRect(x*sx, y*sy, sx-gap, sy-gap);
}

function renderLists(){
  const ll = $('#layerList');
  ll.innerHTML = S.cfg.layers.map((L,i) => `
    <div class="layer-item ${i===S.layer?'active':''}" data-layer="${i}">
      <span class="dot" style="background:${esc(L.color)};box-shadow:0 0 8px ${esc(L.color)}"></span>
      <span class="nm">${esc(L.name)}</span>
      <canvas class="thumb" width="128" height="32" data-thumb="${i}"></canvas>
      <span class="idx">${i+1}</span>
    </div>`).join('') + `<div class="small faint" style="margin-top:6px">Press keys 7 + 9 (or your configured layer switch) to move between layers.</div>`;
  ll.querySelectorAll('[data-thumb]').forEach(cv => paintBits(cv, oledBits(+cv.dataset.thumb, null)));
  ll.querySelectorAll('[data-layer]').forEach(el => el.onclick = () => setLayer(+el.dataset.layer));

  const cl = $('#comboList');
  cl.innerHTML = S.cfg.combos.length ? S.cfg.combos.map((c,i) => `

    const lbl = labelOf(a); const isNone = !a || a.type==='none';
    const cls = ['key', isNone?'empty':'',
      S.mode==='edit' && S.sel.kind==='key' && S.sel.i===i && !S.pick ? 'sel':'',
      selCombo && selCombo.keys.includes(i) ? 'combo-hl':'',
      S.pick && S.pick.has(i) ? 'picked':'',
      sim.down.has(i) ? 'down':''].join(' ');
    const combos = combosFor(i);
    return `<button class="${cls}" data-key="${i}">
      <span class="badges">${a && a.hold && a.hold.type!=='none' ? '<span class="badge hold" title="Does something else when held">HOLD</span>':''}${combos.length?`<span class="badge combo" title="Part of a combo">C${combos.map(c=>c+1).join(',')}</span>`:''}</span>
      <span class="pos">${i+1}</span>
      <span style="min-width:0"><div class="lbl">${isNone ? '—' : esc(lbl || '·')}</div><div class="sub">${esc(isNone ? 'Unassigned' : describe(a))}</div></span>
    </button>`;
  }).join('');
  keysEl.querySelectorAll('[data-key]').forEach(b => {
    const i = +b.dataset.key;
    b.onmousedown = e => { if (S.mode==='try'){ e.preventDefault(); simDown(i, false); } };
    b.onmouseup = () => { if (S.mode==='try') simUp(i); };
    b.onmouseleave = () => { if (S.mode==='try' && sim.down.has(i) && sim.down.get(i).mouse) simUp(i); };
    b.onclick = () => { if (S.mode!=='edit') return;
      if (S.pick){ S.pick.has(i) ? S.pick.delete(i) : S.pick.add(i); renderDevice(); renderInspector(); return; }
      S.sel = {kind:'key', i}; renderAll(); };
  });

  paintBits($('#oledCanvas'), oledBits(active, S.mode==='try' ? sim.toast : null));
  const layerSel = S.mode==='edit' && S.sel.kind==='layer' && !S.pick;
  $('#oled').classList.toggle('sel', layerSel);
  const col = L.color || '#000';
  const led = $('#led'); led.style.background = col; led.style.boxShadow = `0 0 10px 2px ${col}, 0 0 26px 6px ${col}66`;
  led.classList.toggle('sel', layerSel);
  $('#knobState').textContent = S.cfg.settings.knob ? 'Knob · fitted' : 'Knob · not fitted';
  const encSel = S.mode==='edit' && S.sel.kind==='enc' && !S.pick;
  $('#knob').classList.toggle('sel', encSel && S.encPart==='press');
  $('#kccw').classList.toggle('sel', encSel && S.encPart==='ccw');
  $('#kcw').classList.toggle('sel', encSel && S.encPart==='cw');
  $('#knob').style.transform = `rotate(${sim.knobAngle}deg)`;

  $('#hint').innerHTML = S.mode==='edit'
    ? (S.pick ? 'Click the keys that make up this combo (2 or more), then press <b>Done</b> on the right.'
              : 'Click a key, the knob (↺, ↻ or the centre), or the screen to change what it does.')
    : 'Click keys, or press <kbd>1</kbd>–<kbd>9</kbd> on your keyboard (hold a few at once for combos, hold one down for hold actions). Scroll on the knob to turn it, click it to press.';
}

function setLayer(i){
  S.layer = i; sim.base = i; sim.tog = null; sim.mo = null;
  if (S.mode==='edit' && S.sel.kind==='combo') S.sel = {kind:'key', i:0};
  renderAll();
}

/* ---------- inspector ---------- */
function slotTarget(){
  const L = curL();
  if (S.sel.kind==='key') return {get:()=>L.keys[S.sel.i], set:v=>L.keys[S.sel.i]=v, allowHold:true, title:'Key '+(S.sel.i+1), sub:`on ${L.name}`};
  if (S.sel.kind==='enc') return {get:()=>L.encoder[S.encPart], set:v=>L.encoder[S.encPart]=v, allowHold:false, title:S.cfg.settings.knob?'Knob':'Knob · not fitted', sub:`on ${L.name}`};
  if (S.sel.kind==='combo'){ const c = S.cfg.combos[S.sel.i]; return c && {get:()=>c.action, set:v=>c.action=v, allowHold:false, title:'Combo '+(S.sel.i+1), sub:'keys '+c.keys.map(k=>k+1).join(' + ')+' · every layer'}; }
  return null;
}
const TYPES = [['none','None'],['key','Shortcut'],['media','Media'],['text','Type text'],['macro','Macro'],['layer','Layer']];
const uiType = a => !a || a.type==='none' ? 'none' : (a.type==='key' && isMedia(a.key) ? 'media' : a.type);

function renderInspector(){
  const el = $('#inspector');
  if (S.mode==='try'){
    const L = S.cfg.layers[activeLayer()];
    el.innerHTML = `<div class="ph"><div class="insp-title"><span class="big">Trying it out</span><span class="muted small">on ${esc(L.name)}</span></div></div>
      <div class="pb stack"><p class="muted" style="margin:0">This is a preview of the real pad: the screen, the LED and the keystrokes your computer would receive. Nothing is sent to your computer.</p>
      <div class="section"><label class="f">This layer</label>${L.keys.map((a,i)=>`<div class="row small" style="padding:3px 0"><span class="kchip">${i+1}</span><b style="min-width:76px">${esc(labelOf(a)||'—')}</b><span class="muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(describe(a))}${a&&a.hold&&a.hold.type!=='none'?' · hold: '+esc(describe(a.hold)):''}</span></div>`).join('')}
      <div class="row small" style="padding:3px 0"><span class="kchip">↺</span><span class="muted">${esc(describe(L.encoder.ccw))}</span></div>
      <div class="row small" style="padding:3px 0"><span class="kchip">↻</span><span class="muted">${esc(describe(L.encoder.cw))}</span></div>
      <div class="row small" style="padding:3px 0"><span class="kchip">●</span><span class="muted">${esc(describe(L.encoder.press))}</span></div></div>
      <button class="btn" id="backEdit">← Back to editing</button></div>`;
    el.querySelector('#backEdit').onclick = () => setMode('edit');
    return;
  }
  if (S.pick) return renderPick(el);
  if (S.sel.kind==='layer') return renderLayerInspector(el);
  const t = slotTarget(); if (!t){ S.sel={kind:'key',i:0}; return renderInspector(); }
  const a = t.get() || {type:'none'};
  let html = `<div class="ph"><div class="insp-title"><span class="big">${esc(t.title)}</span><span class="muted small">${esc(t.sub)}</span></div>
    ${S.sel.kind==='combo'?'<button class="btn sm danger" id="delCombo">Delete</button>':''}</div><div class="pb stack">`;
  if (S.sel.kind==='enc'){
    html += `<div class="tabs">${[['ccw','↺ Turn left'],['press','● Press'],['cw','↻ Turn right']].map(([p,l])=>`<button class="tab ${S.encPart===p?'on':''}" data-encpart="${p}">${l}</button>`).join('')}</div>`;
  }
  if (S.sel.kind==='combo'){
    html += `<div class="row"><button class="btn sm" id="editComboKeys">Change keys</button><span class="small faint">Press them within ${S.cfg.settings.combo_timeout} ms of each other.</span></div>`;
  }
  html += actionEditor(a, 'main');
  if (t.allowHold) html += holdEditor(a);
  el.innerHTML = html + '</div>';
  bindEditor(el, t);
  el.querySelectorAll('[data-encpart]').forEach(b => b.onclick = () => { S.encPart = b.dataset.encpart; renderDevice(); renderInspector(); });
  const dc = el.querySelector('#delCombo'); if (dc) dc.onclick = () => { S.cfg.combos.splice(S.sel.i,1); S.sel={kind:'key',i:0}; changed(); };
  const ek = el.querySelector('#editComboKeys'); if (ek) ek.onclick = () => { S.pick = new Set(S.cfg.combos[S.sel.i].keys); S.pickFor = S.sel.i; renderAll(); };
}

function keySelect(cur, attr){
  let h = `<select class="in" ${attr}>`;
  for (const [g, list] of Object.entries(KEY_GROUPS)){
    h += `<optgroup label="${g}">` + list.map(([k,l]) => `<option value="${k}" ${k===cur?'selected':''}>${esc(l)}</option>`).join('') + '</optgroup>';
  }
  return h + '</select>';
}
function modButtons(mods, attrs, compact){
  return `<div class="mods ${compact?'compact':''}">` + MODS.map(m => `<button class="mod ${(mods||[]).includes(m.k)?'on':''}" ${attrs} data-m="${m.k}">${m.sym}<span>${m.name}</span></button>`).join('') + '</div>';
}

function actionEditor(a, slot, {showTypes=true}={}){
  const ut = uiType(a);
  let h = '';
  if (showTypes) h += `<div><label class="f">Action</label><div class="tabs">${TYPES.map(([v,l]) => `<button class="tab ${ut===v?'on':''}" data-type="${v}" data-slot="${slot}">${l}</button>`).join('')}</div></div>`;
  if (ut==='key'){
    h += `<div><label class="f">Shortcut</label>${modButtons(a.mods,`data-mod="${slot}"`)}</div>
      <div class="row">${keySelect(a.key, `data-keysel="${slot}"`)}<button class="btn" data-record="${slot}" style="white-space:nowrap">⏺ Record</button></div>`;
    if (slot==='main'){
      h += `<div><label class="f">Quick picks</label><select class="in" data-preset="${slot}"><option value="">Choose a common shortcut…</option>${
        Object.entries(PRESETS).map(([g,list]) => `<optgroup label="${esc(g)}">${list.map((p,i)=>`<option value="${esc(g)}|${i}">${esc(p.name)}  ·  ${esc(describe(p.a))}</option>`).join('')}</optgroup>`).join('')}</select></div>`;
    }
  } else if (ut==='media'){
    h += `<div class="grid3">${MEDIA.map(([k,l]) => `<button class="pick ${a.key===k?'on':''}" data-media="${k}" data-slot="${slot}"><b>${esc(l)}</b></button>`).join('')}</div>`;
  } else if (ut==='text'){
    const bad = /[^\x00-\x7f]/.test(a.text||'');
    h += `<div><label class="f">Text to type</label><textarea class="in" data-text="${slot}" placeholder="e.g. Be right back">${esc(a.text||'')}</textarea>
      ${bad?'<div class="warn">Only plain ASCII characters can be typed. Emoji and accented letters will be skipped.</div>':''}</div>`;
  } else if (ut==='macro'){
    h += macroEditor(a, slot);
  } else if (ut==='layer'){
    const opts = [['next','Next layer'],['prev','Previous layer'], ...S.cfg.layers.map((L,i)=>[String(i), L.name])];
    const modes = slot==='hold' ? {mo:'Only while held', to:'Switch to', tg:'Toggle on/off'} : {to:'Switch to', mo:'Only while held', tg:'Toggle on/off'};
    h += `<div class="grid2">
      <div><label class="f">Mode</label><select class="in" data-lmode="${slot}">${Object.entries(modes).map(([v,l])=>`<option value="${v}" ${(a.mode||'to')===v?'selected':''}>${l}</option>`).join('')}</select></div>
      <div><label class="f">Layer</label><select class="in" data-ltarget="${slot}">${opts.map(([v,l])=>`<option value="${esc(v)}" ${String(a.layer)===v?'selected':''}>${esc(l)}</option>`).join('')}</select></div></div>`;
  }
  if (ut!=='none' && slot==='main'){
    h += `<div class="grid2" style="grid-template-columns:1fr 1.4fr"><div><label class="f">Screen label</label>
      <input class="in" data-label="${slot}" maxlength="10" value="${esc(a.label||'')}" placeholder="${esc(autoLabel(a))}"></div>
      <div><label class="f">Sends</label><div class="preview-line" data-sends>${esc(describe(a))}</div></div></div>`;
  }
  return h;
}

function macroEditor(a, slot){
  const steps = a.steps || [];
  const KINDS = [['tap','Press shortcut'],['press','Hold down'],['release','Let go'],['delay','Wait'],['text','Type text']];
  let h = `<div><label class="f">Steps · run top to bottom</label><div class="steps">`;
  steps.forEach((st,i) => {
    let f = '';
    if (['tap','press','release'].includes(st.do)) f = `${modButtons(st.mods,`data-smod="${i}"`,true)}${keySelect(st.key, `data-skey="${i}"`)}`;
    else if (st.do==='delay') f = `<div class="row"><input class="in" type="number" min="0" max="5000" step="10" value="${st.ms||0}" data-sms="${i}" style="width:110px"><span class="muted small">milliseconds</span></div>`;
    else if (st.do==='text') f = `<input class="in" value="${esc(st.text||'')}" data-stext="${i}" placeholder="text to type">`;
    h += `<div class="step"><span class="n">${i+1}</span><div class="stack">
      <select class="in" data-skind="${i}">${KINDS.map(([v,l])=>`<option value="${v}" ${st.do===v?'selected':''}>${l}</option>`).join('')}</select>${f}</div>
      <div class="ctl"><button data-sup="${i}" title="Move up">▲</button><button data-sdown="${i}" title="Move down">▼</button><button data-sdel="${i}" title="Remove">✕</button></div></div>`;
  });
  if (!steps.length) h += `<div class="small faint">No steps yet.</div>`;
  h += `</div><div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn sm" data-sadd="tap">+ Shortcut</button><button class="btn sm" data-sadd="delay">+ Wait</button><button class="btn sm" data-sadd="text">+ Text</button>
    <span class="spacer"></span><button class="btn sm" data-mrec="${slot}">⏺ Record</button></div>
    <div class="small faint" style="margin-top:6px">Record captures your key presses and the pauses between them. The browser won't let it capture a few shortcuts (⌘W, ⌘Q, ⌘T), so add those as steps instead.</div></div>`;
  return h;
}

function holdEditor(a){
  const hold = a.hold || {type:'none'};
  const ut = uiType(hold);
  let h = `<div class="section stack"><div><label class="f">When held (longer than ${S.cfg.settings.hold_ms} ms)</label>
    <div class="tabs">${[['none','Nothing extra'],['key','Shortcut'],['media','Media'],['layer','Layer']].map(([v,l])=>`<button class="tab ${ut===v?'on':''}" data-type="${v}" data-slot="hold">${l}</button>`).join('')}</div></div>`;
  if (ut!=='none'){
    h += actionEditor(hold,'hold',{showTypes:false});
    h += `<div class="preview-line">tap → ${esc(describe(a))}<br>hold → ${esc(describe(hold))}</div>`;
  }
  return h + '</div>';
}

function bindEditor(el, t){
  const get = slot => slot==='hold' ? (t.get().hold || {type:'none'}) : t.get();
  const put = (slot, v) => {
    if (slot==='hold'){ const m = t.get(); if (v.type==='none') delete m.hold; else m.hold = v; return; }
    const old = t.get(); if (old && old.hold && t.allowHold) v.hold = old.hold; t.set(v);
  };
  const relabel = (slot, before, after) => { if (slot==='main' && (!before || !before.label || before.label===autoLabel(before))) after.label = autoLabel(after); return after; };
  const edit = (slot, fn) => { const a = get(slot); const before = clone(a); fn(a); relabel(slot, before, a); if (slot==='hold') t.get().hold = a; changed(); };

  el.querySelectorAll('[data-type]').forEach(b => b.onclick = () => {
    const slot = b.dataset.slot, ty = b.dataset.type, before = get(slot);
    if (uiType(before)===ty) return;
    let v;
    if (ty==='none') v = {type:'none'};
    else if (ty==='key') v = {type:'key', key:'A', mods:['LCMD']};
    else if (ty==='media') v = {type:'key', key:'MPLY', mods:[]};
    else if (ty==='text') v = {type:'text', text:''};
    else if (ty==='macro') v = {type:'macro', steps:[{do:'tap', key:'C', mods:['LCMD']},{do:'delay', ms:100},{do:'tap', key:'V', mods:['LCMD']}]};
    else if (ty==='layer') v = {type:'layer', mode: slot==='hold'?'mo':'to', layer:'next'};
    put(slot, relabel(slot, before, v)); changed();
  });
  el.querySelectorAll('[data-mod]').forEach(b => b.onclick = () => edit(b.dataset.mod, a => { const m = b.dataset.m; a.mods = (a.mods||[]).includes(m) ? a.mods.filter(x=>x!==m) : sortMods([...(a.mods||[]), m]); }));
  el.querySelectorAll('[data-keysel]').forEach(s => s.onchange = () => edit(s.dataset.keysel, a => { a.key = s.value; }));
  el.querySelectorAll('[data-preset]').forEach(s => s.onchange = () => { if (!s.value) return; const [g,i] = s.value.split('|'); put('main', clone(PRESETS[g][+i].a)); changed(); });
  el.querySelectorAll('[data-media]').forEach(b => b.onclick = () => edit(b.dataset.slot, a => { a.key = b.dataset.media; a.mods = []; }));
  el.querySelectorAll('[data-text]').forEach(x => {
    x.oninput = () => { const a = get('main'); const before = clone(a); a.text = x.value; relabel('main', before, a);
      const lb = el.querySelector('[data-label]'); if (lb) lb.placeholder = autoLabel(a);
      const sd = el.querySelector('[data-sends]'); if (sd) sd.textContent = describe(a); changedQuiet(); };
    x.onchange = () => renderInspector();
  });
  el.querySelectorAll('[data-label]').forEach(x => x.oninput = () => { const v = asciiOnly(x.value).toUpperCase(); if (x.value!==v) x.value = v; get('main').label = v; changedQuiet(); });
  el.querySelectorAll('[data-lmode]').forEach(s => s.onchange = () => edit(s.dataset.lmode, a => { a.mode = s.value; }));
  el.querySelectorAll('[data-ltarget]').forEach(s => s.onchange = () => edit(s.dataset.ltarget, a => { a.layer = /^\d+$/.test(s.value) ? +s.value : s.value; }));
  el.querySelectorAll('[data-record]').forEach(b => b.onclick = () => startRecord('shortcut', b.dataset.record, get, b, t));
  el.querySelectorAll('[data-mrec]').forEach(b => b.onclick = () => startRecord('macro', 'main', get, b, t));
  // macro steps
  const steps = () => get('main').steps;
  el.querySelectorAll('[data-skind]').forEach(s => s.onchange = () => { const i = +s.dataset.skind, st = steps()[i], k = s.value;
    steps()[i] = k==='delay' ? {do:k, ms:100} : k==='text' ? {do:k, text:''} : {do:k, key:st.key||'A', mods:st.mods||[]}; changed(); });
  el.querySelectorAll('[data-smod]').forEach(b => b.onclick = () => { const st = steps()[+b.dataset.smod], m = b.dataset.m;
    st.mods = (st.mods||[]).includes(m) ? st.mods.filter(x=>x!==m) : sortMods([...(st.mods||[]),m]); changed(); });
  el.querySelectorAll('[data-skey]').forEach(s => s.onchange = () => { steps()[+s.dataset.skey].key = s.value; changed(); });
  el.querySelectorAll('[data-sms]').forEach(x => x.onchange = () => { steps()[+x.dataset.sms].ms = Math.max(0, Math.min(5000, +x.value||0)); changed(); });
  el.querySelectorAll('[data-stext]').forEach(x => { x.oninput = () => { steps()[+x.dataset.stext].text = x.value; changedQuiet(); }; x.onchange = () => renderInspector(); });
  el.querySelectorAll('[data-sup]').forEach(b => b.onclick = () => { const i=+b.dataset.sup, s=steps(); if (i>0){ [s[i-1],s[i]]=[s[i],s[i-1]]; changed(); } });
  el.querySelectorAll('[data-sdown]').forEach(b => b.onclick = () => { const i=+b.dataset.sdown, s=steps(); if (i<s.length-1){ [s[i+1],s[i]]=[s[i],s[i+1]]; changed(); } });
  el.querySelectorAll('[data-sdel]').forEach(b => b.onclick = () => { steps().splice(+b.dataset.sdel,1); changed(); });
  el.querySelectorAll('[data-sadd]').forEach(b => b.onclick = () => { const k=b.dataset.sadd; steps().push(k==='delay'?{do:k,ms:100}:k==='text'?{do:k,text:''}:{do:'tap',key:'A',mods:[]}); changed(); });
}

/* recording real keystrokes */
function startRecord(kind, slot, get, btn, t){
  if (S.recording){ stopRecord(); return; }
  btn.classList.add('rec'); btn.textContent = kind==='macro' ? '■ Stop' : 'Press keys…';
  const rec = {kind, slot, get, t, mods:new Set(), steps:[], last:performance.now()};
  rec.down = e => {
    e.preventDefault(); e.stopPropagation();
    if (e.code==='Escape' && kind==='shortcut' && !rec.mods.size){ stopRecord(); return; }
    const m = MOD_CODES[e.code]; if (m){ rec.mods.add(m); return; }
    const k = CODE_TO_KMK[e.code]; if (!k || e.repeat) return;
    const mods = sortMods([...rec.mods]);
    if (kind==='shortcut'){
      const a = get(slot), before = clone(a); a.key = k; a.mods = mods;
      if (slot==='main' && (!before.label || before.label===autoLabel(before))) a.label = autoLabel(a);
      if (slot==='hold') t.get().hold = a;
      stopRecord(); changed(); return;
    }
    const now = performance.now(), gap = Math.round((now-rec.last)/10)*10;
    if (rec.steps.length && gap >= 150) rec.steps.push({do:'delay', ms:Math.min(gap,5000)});
    rec.steps.push({do:'tap', key:k, mods}); rec.last = now;
    notify(`Recorded ${rec.steps.filter(s=>s.do==='tap').length} key press(es)… click ■ Stop when done`);
  };
  rec.up = e => { const m = MOD_CODES[e.code]; if (m) rec.mods.delete(m); };
  window.addEventListener('keydown', rec.down, true); window.addEventListener('keyup', rec.up, true);
  S.recording = rec;
}
function stopRecord(){
  const rec = S.recording; if (!rec) return; S.recording = null;
  window.removeEventListener('keydown', rec.down, true); window.removeEventListener('keyup', rec.up, true);
  if (rec.kind==='macro' && rec.steps.length){ rec.get('main').steps = rec.steps; changed(); notify('Macro recorded: '+rec.steps.length+' steps','ok'); }
  else renderInspector();
}

function renderPick(el){
  const n = S.pick.size, cl = clash();
  el.innerHTML = `<div class="ph"><div class="insp-title"><span class="big">${S.pickFor!=null?'Change combo keys':'New combo'}</span></div></div>
   <div class="pb stack"><p class="muted" style="margin:0">Click the keys on the pad that should be pressed <b>together</b>. Pick at least 2.</p>
   <div class="row"><span class="chipset">${[...S.pick].sort((a,b)=>a-b).map(k=>`<span class="kchip">${k+1}</span>`).join('<span class="faint">+</span>') || '<span class="faint small">no keys yet</span>'}</span></div>
   ${cl?`<div class="warn">${cl}</div>`:''}
   <div class="small faint">Tip: a key in a combo waits ${S.cfg.settings.combo_timeout} ms before acting alone, so you can press its partners.</div>
   <div class="row"><button class="btn primary" id="pickDone" ${n<2||cl?'disabled style="opacity:.5"':''}>Done</button><button class="btn ghost" id="pickCancel">Cancel</button></div></div>`;
  el.querySelector('#pickCancel').onclick = () => { S.pick=null; S.pickFor=null; renderAll(); };
  el.querySelector('#pickDone').onclick = () => { if (n<2 || clash()) return;
    const keys = [...S.pick].sort((a,b)=>a-b);
    if (S.pickFor!=null){ S.cfg.combos[S.pickFor].keys = keys; S.sel={kind:'combo', i:S.pickFor}; }
    else { S.cfg.combos.push({keys, action:sc('Q',['LCTL','LCMD'],'LOCK')}); S.sel={kind:'combo', i:S.cfg.combos.length-1}; }
    S.pick=null; S.pickFor=null; changed(); };
}
function clash(){
  if (!S.pick || S.pick.size<2) return '';
  const keys = [...S.pick].sort((a,b)=>a-b).join(',');
  const dup = S.cfg.combos.findIndex((c,i) => i!==S.pickFor && [...c.keys].sort((a,b)=>a-b).join(',')===keys);
  return dup>=0 ? `Combo ${dup+1} already uses these keys.` : '';
}

function renderLayerInspector(el){
  const L = curL(); const i = S.layer;
  const lib = Object.keys(S.images).sort();
  el.innerHTML = `<div class="ph"><div class="insp-title"><span class="big">${esc(L.name)}</span><span class="muted small">layer ${i+1} · screen & LED</span></div>
    <div class="row"><button class="btn sm" id="dupLayer">Duplicate</button>${S.cfg.layers.length>1?'<button class="btn sm danger" id="delLayer">Delete</button>':''}</div></div>
    <div class="pb stack">
      <div class="grid2" style="grid-template-columns:1fr auto"><div><label class="f">Name (shown on screen)</label><input class="in" id="lname" maxlength="10" value="${esc(L.name)}"></div>
      <div><label class="f">LED</label><input type="color" id="lcolor" value="${esc(L.color)}"></div></div>
      <div><label class="f">Screen image</label><div class="imgs">
        <div class="imgopt ${!L.image?'on':''}" data-img=""><canvas width="128" height="32" data-prev=""></canvas><small>Just the name</small></div>
        ${lib.map(p=>`<div class="imgopt ${L.image===p?'on':''}" data-img="${esc(p)}"><canvas width="128" height="32" data-prev="${esc(p)}"></canvas><small>${esc(p.replace('lib/',''))}${S.pending[p]?' · new':''}</small></div>`).join('')}
      </div><button class="btn sm" id="upImg" style="margin-top:8px">⬆ Upload your own image…</button>
      <div class="small faint" style="margin-top:6px">Any picture works: it's shrunk to 128×32 and turned black and white.</div></div>
    </div>`;
  el.querySelectorAll('[data-prev]').forEach(cv => paintBits(cv, oledBits(i, null, cv.dataset.prev || null)));
  el.querySelectorAll('[data-img]').forEach(d => d.onclick = () => { L.image = d.dataset.img || null; changed(); });
  el.querySelector('#lname').oninput = e => { L.name = asciiOnly(e.target.value).toUpperCase().slice(0,10) || 'LAYER'; changedQuiet(); };
  el.querySelector('#lname').onchange = () => renderInspector();
  el.querySelector('#lcolor').oninput = e => { L.color = e.target.value; changedQuiet(); };
  el.querySelector('#upImg').onclick = () => $('#fileImage').click();
  el.querySelector('#dupLayer').onclick = () => { if (S.cfg.layers.length>=8) return notify('8 layers is the maximum','bad');
    const c = clone(L); c.name = (L.name.slice(0,8)+' 2'); fixLayerRefs(i+1, +1); S.cfg.layers.splice(i+1,0,c); S.layer=i+1; changed(); };
  const del = el.querySelector('#delLayer'); if (del) del.onclick = () => { if (!confirm(`Delete layer “${L.name}”?`)) return;
    S.cfg.layers.splice(i,1); fixLayerRefs(i, -1); S.layer = Math.max(0,i-1); sim.base=S.layer; changed(); };
}
function eachAction(fn){
  const walk = a => { if (!a) return; fn(a); if (a.hold) walk(a.hold); };
  for (const L of S.cfg.layers){ L.keys.forEach(walk); Object.values(L.encoder).forEach(walk); }
  S.cfg.combos.forEach(c => walk(c.action));
}
function fixLayerRefs(at, delta){
  eachAction(a => { if (a.type!=='layer' || typeof a.layer!=='number') return;
    if (delta<0 && a.layer===at) a.layer = 'next';
    else if (a.layer >= at) a.layer += delta;
  });
}

function renderAll(){ renderHeader(); renderLists(); renderDevice(); renderInspector(); }

/* ================= simulation ================= */
function activeLayer(){ const n=S.cfg.layers.length; const v = sim.mo ?? sim.tog ?? sim.base; return Math.min(v, n-1); }
function resolveTarget(t, here){ const n=S.cfg.layers.length; return t==='next'?(here+1)%n : t==='prev'?(here-1+n)%n : Math.min(+t, n-1); }
function showToast(text){
  if (!text || !S.cfg.settings.toast_ms) return; sim.toast = text; clearTimeout(sim.toastTimer);
  sim.toastTimer = setTimeout(() => { sim.toast = null; renderDevice(); }, S.cfg.settings.toast_ms);
}
function logLine(src, a){
  const ts = new Date().toTimeString().slice(0,8);
  S.log.unshift({ts, src, txt: describe(a)}); S.log = S.log.slice(0,60); renderLog();
}
function renderLog(){
  $('#log').innerHTML = S.log.length ? S.log.map(l => `<li><span class="t">${l.ts}</span><span class="s">${esc(l.src)}</span><span>${esc(l.txt)}</span></li>`).join('')
    : `<div class="empty">Switch to ▶ Try it and press a key. Everything the pad would send shows up here.</div>`;
}
function fire(a, src, {release=false}={}){
  const before = activeLayer();
  if (!a || a.type==='none'){ if (!release) logLine(src, a); return; }
  if (a.type==='layer'){
    const tgt = resolveTarget(a.layer ?? 'next', before);
    if (a.mode==='mo'){ sim.mo = release ? null : tgt; }
    else if (!release && a.mode==='tg'){ sim.tog = sim.tog===tgt ? null : tgt; }
    else if (!release){ sim.base = tgt; sim.tog = null; sim.mo = null; }
  }
  if (!release){ logLine(src, a); showToast(labelOf(a)); }
  const after = activeLayer();
  if (after!==before){ S.layer = after; showToast(S.cfg.layers[after].name); renderLists(); renderInspector(); }
  renderDevice();
}
const inCombo = i => S.cfg.combos.some(c => c.keys.includes(i));
function simDown(i, viaKeyboard){
  if (sim.down.has(i)) return;
  const a = S.cfg.layers[activeLayer()].keys[i]; const hasHold = !!(a && a.hold && a.hold.type!=='none');
  const st = {held:false, consumed:false, fired:false, mouse:!viaKeyboard, action:a};
  sim.down.set(i, st);
  if (!hasHold && !inCombo(i)){ st.fired = true; fire(a, 'Key '+(i+1)); return; }
  sim.pending.add(i);
  clearTimeout(sim.evalTimer); sim.evalTimer = setTimeout(evalCombos, S.cfg.settings.combo_timeout);
  if (hasHold){
    st.holdTimer = setTimeout(() => { if (sim.down.get(i)===st && !st.consumed){ st.held = true; st.fired = true; fire(a.hold, 'Key '+(i+1)+' held'); } }, S.cfg.settings.hold_ms);
  }
  renderDevice();
}
function evalCombos(){
  const set = [...sim.pending].sort((a,b)=>a-b).join(',');
  const c = sim.pending.size>=2 && S.cfg.combos.find(c => [...c.keys].sort((a,b)=>a-b).join(',')===set);
  if (c){
    for (const k of sim.pending){ const st = sim.down.get(k); if (st){ st.consumed = true; clearTimeout(st.holdTimer); } }
    fire(c.action, 'Combo '+c.keys.map(k=>k+1).join('+'));
  }
  sim.pending.clear();
}
function simUp(i){
  const st = sim.down.get(i); if (!st) return;
  if (sim.pending.has(i)){ clearTimeout(sim.evalTimer); evalCombos(); }
  sim.down.delete(i); clearTimeout(st.holdTimer);
  const a = st.action;
  if (!st.consumed){
    if (st.held){ if (a.hold.type==='layer' && a.hold.mode==='mo') fire(a.hold, '', {release:true}); }
    else if (!st.fired) fire(a, 'Key '+(i+1));
    else if (a && a.type==='layer' && a.mode==='mo') fire(a, '', {release:true});
  }
  renderDevice();
}
function encoder(part){
  if (!S.cfg.settings.knob) return;
  const enc = S.cfg.layers[activeLayer()].encoder;
  if (part==='press'){ const k = $('#knob'); k.classList.add('pressed'); setTimeout(()=>k.classList.remove('pressed'),140); }
  else sim.knobAngle += part==='cw' ? 24 : -24;
  fire(enc[part], {ccw:'Knob ↺', cw:'Knob ↻', press:'Knob press'}[part]);
  renderDevice();
}
function setMode(m){
  if (S.recording) stopRecord();
  S.mode = m;
  $('#modeEdit').classList.toggle('on', m==='edit'); $('#modeTry').classList.toggle('on', m==='try'); $('#modeTry').classList.toggle('try', m==='try');
  if (m==='try'){ sim.base = S.layer; sim.tog = null; sim.mo = null; S.pick = null; showToast(curL().name); }
  else { sim.toast = null; sim.down.clear(); sim.pending.clear(); }
  renderAll();
}

/* ================= images ================= */
function encodeBMP(bits){
  const w=128,h=32,rowBytes=16,dataSize=rowBytes*h,offs=62,size=offs+dataSize;
  const b=new Uint8Array(size), dv=new DataView(b.buffer);
  b[0]=0x42;b[1]=0x4D; dv.setUint32(2,size,true); dv.setUint32(10,offs,true);
  dv.setUint32(14,40,true); dv.setInt32(18,w,true); dv.setInt32(22,h,true); dv.setUint16(26,1,true); dv.setUint16(28,1,true);
  dv.setUint32(34,dataSize,true); dv.setInt32(38,2835,true); dv.setInt32(42,2835,true); dv.setUint32(46,2,true); dv.setUint32(50,2,true);
  b[58]=255;b[59]=255;b[60]=255; // palette: index 0 = black, 1 = white
  for (let y=0;y<h;y++){ const row=h-1-y; for (let x=0;x<w;x++) if (bits[y*w+x]) b[offs+row*rowBytes+(x>>3)] |= 0x80>>(x&7); }
  return b;
}
function convertImage(img, {threshold, invert, dither, fit}){
  const c = document.createElement('canvas'); c.width=128; c.height=32; const x = c.getContext('2d', {willReadFrequently:true});
  x.fillStyle = '#000'; x.fillRect(0,0,128,32);
  const r = fit==='cover' ? Math.max(128/img.width, 32/img.height) : Math.min(128/img.width, 32/img.height);
  const w = img.width*r, h = img.height*r; x.imageSmoothingQuality='high'; x.drawImage(img, (128-w)/2, (32-h)/2, w, h);
  const d = x.getImageData(0,0,128,32).data; const lum = new Float32Array(128*32);
  for (let i=0;i<lum.length;i++){ const v = d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11; lum[i] = invert ? 255-v : v; }
  const bits = new Uint8Array(128*32);
  for (let y=0;y<32;y++) for (let xx=0;xx<128;xx++){
    const i=y*128+xx, v=lum[i], o = v>threshold?255:0; bits[i] = o?1:0;
    if (dither){ const e=v-o; if(xx<127) lum[i+1]+=e*7/16; if(y<31){ if(xx>0) lum[i+127]+=e*3/16; lum[i+128]+=e*5/16; if(xx<127) lum[i+129]+=e/16; } }
  }
  return bits;
}
function openImageModal(file){
  const img = new Image(); const url = URL.createObjectURL(file);
  img.onerror = () => notify("Couldn't read that image", 'bad');
  img.onload = () => {
    const base = file.name.replace(/\.[^.]+$/,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,20) || 'image';
    const opt = {threshold:128, invert:false, dither:true, fit:'cover'};
    const root = $('#modalRoot');
    root.innerHTML = `<div class="modal-bg"><div class="modal"><div class="ph"><h3>Add screen image</h3><button class="btn sm ghost" id="mx">✕</button></div>
      <div class="pb stack"><div class="oled" style="cursor:default"><canvas id="mprev" width="512" height="128"></canvas></div>
      <div style="margin-top:22px"><label class="f">Brightness cut-off</label><input type="range" min="10" max="245" value="128" id="mth"></div>
      <div class="row" style="flex-wrap:wrap"><label class="row small"><input type="checkbox" id="mdi" checked> Dither (shading)</label><label class="row small"><input type="checkbox" id="minv"> Invert</label>
        <select class="in" id="mfit" style="width:auto"><option value="cover">Fill the screen</option><option value="contain">Fit the whole picture</option></select></div>
      <div><label class="f">File name</label><div class="row"><span class="muted small">lib/</span><input class="in" id="mname" value="${esc(base)}"><span class="muted small">.bmp</span></div></div>
      <div class="row"><button class="btn primary" id="madd">Use on “${esc(curL().name)}”</button><button class="btn ghost" id="mcancel">Cancel</button></div></div></div></div>`;
    const draw = () => paintBits($('#mprev'), convertImage(img, opt));
    draw();
    $('#mth').oninput = e => { opt.threshold = +e.target.value; draw(); };
    $('#mdi').onchange = e => { opt.dither = e.target.checked; draw(); };
    $('#minv').onchange = e => { opt.invert = e.target.checked; draw(); };
    $('#mfit').onchange = e => { opt.fit = e.target.value; draw(); };
    const close = () => { root.innerHTML=''; URL.revokeObjectURL(url); };
    $('#mx').onclick = close; $('#mcancel').onclick = close;
    $('#madd').onclick = () => {
      const name = ($('#mname').value.toLowerCase().replace(/[^a-z0-9_-]+/g,'_') || 'image');
      const path = 'lib/'+name+'.bmp'; const bytes = encodeBMP(convertImage(img, opt));
      S.pending[path] = bytes;
      S.images[path] = URL.createObjectURL(new Blob([bytes], {type:'image/bmp'})); delete S.imgEls[path];
      curL().image = path; close(); changed(); notify(`Added ${path}. It's copied to the pad when you save.`, 'ok');
    };
  };
  img.src = url;
}

/* ================= file sync ================= */
function validate(){
  const errs = [];
  S.cfg.combos.forEach((c,i) => { if (c.keys.length<2) errs.push(`Combo ${i+1} needs 2 or more keys`); });
  eachAction(a => { if (a.type==='macro' && !(a.steps||[]).length) errs.push('One of your macros has no steps'); });
  for (const L of S.cfg.layers) if (L.image && !S.images[L.image]) errs.push(`Layer ${L.name}: image ${L.image} isn't on the pad`);
  return errs;
}
function configJSON(){
  const out = clone(S.cfg);
  // write auto labels out explicitly so the pad shows the same text as this app
  const fill = a => { if (!a) return; if (a.type!=='none' && !a.label) a.label = autoLabel(a); if (a.hold) fill(a.hold); };
  for (const L of out.layers){ L.keys.forEach(fill); Object.values(L.encoder).forEach(fill); }
  out.combos.forEach(c => fill(c.action));
  return JSON.stringify(out, null, 2);
}
async function connect(){
  if (!window.showDirectoryPicker){ notify('Saving straight to the pad needs Chrome or Edge. Use Export and copy keymap.json onto CIRCUITPY yourself.', 'bad'); return; }
  try {
    const dir = await window.showDirectoryPicker({id:'macropad', mode:'readwrite'});
    let hasCode = false, hasLoader = false;
    try { await dir.getFileHandle('code.py'); hasCode = true; } catch(e){}
    try { await dir.getFileHandle('config_loader.py'); hasLoader = true; } catch(e){}
    if (!hasCode){ notify('That folder has no code.py. Choose the CIRCUITPY drive.', 'bad'); return; }
    S.dir = dir;
    const banner = $('#banner');
    if (!hasLoader){ banner.textContent = 'This pad still runs the old firmware. Copy code.py, config_loader.py, macropad_display.py and layer_led.py from the project folder onto CIRCUITPY, then save.'; banner.classList.remove('hidden'); }
    else banner.classList.add('hidden');
    try {
      const lib = await dir.getDirectoryHandle('lib');
      for await (const [name, h] of lib.entries()){
        if (h.kind==='file' && /\.bmp$/i.test(name) && !name.startsWith('._')){ const f = await h.getFile(); const p = 'lib/'+name; S.images[p] = URL.createObjectURL(f); delete S.imgEls[p]; }
      }
    } catch(e){}
    let loaded = false;
    try {
      const fh = await dir.getFileHandle('keymap.json'); const cfg = JSON.parse(await (await fh.getFile()).text());
      if (!S.dirty || confirm('Load the layout that is saved on the pad? Unsaved changes here will be replaced.')){ S.cfg = normalize(cfg); S.dirty = false; S.layer = 0; store('macropad.draft', {cfg:S.cfg, dirty:false}); loaded = true; }
    } catch(e){}
    renderAll(); notify(loaded ? 'Connected. Loaded the layout from the pad.' : 'Connected to '+dir.name+'.', 'ok');
  } catch(e){ if (e.name!=='AbortError') notify('Could not open the folder: '+e.message, 'bad'); }
}
async function writeFile(dir, path, data){
  const parts = path.split('/'); let d = dir;
  for (const p of parts.slice(0,-1)) d = await d.getDirectoryHandle(p, {create:true});
  const fh = await d.getFileHandle(parts.at(-1), {create:true}); const w = await fh.createWritable(); await w.write(data); await w.close();
}
function download(name, data, type){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
async function save(){
  const errs = validate(); if (errs.length){ notify(errs[0], 'bad'); return; }
  const json = configJSON();
  if (!window.showDirectoryPicker){
    download('keymap.json', json, 'application/json');
    for (const [p,b] of Object.entries(S.pending)) download(p.split('/').pop(), b, 'image/bmp');
    notify('Downloaded. Copy keymap.json onto the CIRCUITPY drive (and any .bmp into CIRCUITPY/lib).', 'ok');
    S.dirty=false; store('macropad.draft', {cfg:S.cfg, dirty:false}); renderHeader(); return;
  }
  if (!S.dir){ await connect(); if (!S.dir) return; }
  try {
    for (const [p,b] of Object.entries(S.pending)) await writeFile(S.dir, p, b);
    await writeFile(S.dir, 'keymap.json', json);
    S.pending = {}; S.dirty = false; store('macropad.draft', {cfg:S.cfg, dirty:false}); renderAll();
    notify('Saved! The pad restarts itself and uses the new layout within a few seconds.', 'ok');
  } catch(e){ notify('Save failed: '+e.message, 'bad'); }
}

/* ================= settings ================= */
function openSettings(){
  const s = S.cfg.settings; const root = $('#modalRoot');
  const units = {hold_ms:' ms', combo_timeout:' ms', toast_ms:' ms', led_brightness:'', dim_s:' s', off_s:' s'};
  const field = (k, label, min, max, step) => `<div><label class="f">${label}</label><div class="row"><input type="range" min="${min}" max="${max}" step="${step}" value="${s[k]}" data-set="${k}"><span class="kchip" style="min-width:70px;text-align:center" data-val="${k}">${s[k]}${units[k]}</span></div></div>`;
  root.innerHTML = `<div class="modal-bg"><div class="modal"><div class="ph"><h3>Settings</h3><button class="btn sm ghost" id="sx">✕</button></div><div class="pb stack">
    <label class="row"><input type="checkbox" id="sknob" ${s.knob?'checked':''}> Knob fitted</label>
    ${field('hold_ms','Hold time: how long counts as a hold',120,600,10)}
    ${field('combo_timeout','Combo window: keys pressed together',30,250,5)}
    ${field('toast_ms','Screen label stays for',0,3000,100)}
    ${field('led_brightness','LED brightness',0,0.5,0.01)}
    ${field('dim_s','Screen dims after',5,120,5)}
    ${field('off_s','Screen turns off after',10,600,10)}
    <div class="section row"><button class="btn danger" id="sreset">Reset to the default layout</button><span class="spacer"></span><button class="btn primary" id="sdone">Done</button></div></div></div></div>`;
  root.querySelectorAll('[data-set]').forEach(r => r.oninput = () => { const k=r.dataset.set; s[k] = +r.value; root.querySelector(`[data-val="${k}"]`).textContent = r.value + units[k]; persist(); renderHeader(); });
  $('#sknob').onchange = e => { s.knob = e.target.checked; persist(); };
  const close = () => { root.innerHTML=''; renderAll(); };
  $('#sx').onclick = close; $('#sdone').onclick = close;
  $('#sreset').onclick = () => { if (!confirm('Replace every layer, key and combo with the default layout?')) return; S.cfg = normalize(clone(DEFAULT_CONFIG)); S.layer=0; S.sel={kind:'key',i:0}; root.innerHTML=''; changed(); };
}

/* ================= misc ================= */
let noticeTimer;
function notify(msg, kind=''){ const n = $('#notice'); n.textContent = msg; n.className = 'notice '+kind; clearTimeout(noticeTimer); noticeTimer = setTimeout(()=>n.classList.add('hidden'), 4500); }

function bindGlobal(){
  $('#modeEdit').onclick = () => setMode('edit');
  $('#modeTry').onclick = () => setMode('try');
  const layerSel = () => { if (S.mode==='edit'){ S.sel={kind:'layer'}; S.pick=null; renderAll(); } };
  $('#oled').onclick = layerSel; $('#led').onclick = layerSel;
  const encClick = part => () => { if (S.mode==='try') return encoder(part); S.sel={kind:'enc'}; S.encPart=part; S.pick=null; renderAll(); };
  $('#knob').onclick = encClick('press'); $('#kccw').onclick = encClick('ccw'); $('#kcw').onclick = encClick('cw');
  let wheelAcc = 0;
  $('.knobwrap').addEventListener('wheel', e => { if (S.mode!=='try') return; e.preventDefault(); wheelAcc += e.deltaY; if (Math.abs(wheelAcc) >= 40){ encoder(wheelAcc>0?'cw':'ccw'); wheelAcc = 0; } }, {passive:false});
  $('#btnAddLayer').onclick = () => { if (S.cfg.layers.length>=8) return notify('8 layers is the maximum','bad'); S.cfg.layers.push(blankLayer('LAYER '+(S.cfg.layers.length+1))); S.layer = S.cfg.layers.length-1; S.sel={kind:'layer'}; if (S.mode!=='edit') setMode('edit'); changed(); };
  $('#btnAddCombo').onclick = () => { S.pick = new Set(); S.pickFor = null; if (S.mode!=='edit') setMode('edit'); else renderAll(); };
  $('#btnConnect').onclick = connect;
  $('#btnSave').onclick = save;
  $('#btnExport').onclick = () => download('keymap.json', configJSON(), 'application/json');
  $('#btnImport').onclick = () => $('#fileImport').click();
  $('#fileImport').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { S.cfg = normalize(JSON.parse(await f.text())); S.layer=0; S.sel={kind:'key',i:0}; changed(); notify('Imported '+f.name,'ok'); } catch(err){ notify('That is not a valid keymap.json: '+err.message,'bad'); } e.target.value=''; };
  $('#fileImage').onchange = e => { const f = e.target.files[0]; if (f) openImageModal(f); e.target.value=''; };
  $('#btnSettings').onclick = openSettings;
  $('#btnClearLog').onclick = () => { S.log = []; renderLog(); };
  window.addEventListener('keydown', e => {
    if (S.mode!=='try' || S.recording || e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^(Digit|Numpad)[1-9]$/.test(e.code)){ e.preventDefault(); if (!e.repeat) simDown(+e.code.slice(-1)-1, true); }
  });
  window.addEventListener('keyup', e => { if (S.mode==='try' && /^(Digit|Numpad)[1-9]$/.test(e.code)) simUp(+e.code.slice(-1)-1); });
  window.addEventListener('beforeunload', e => { if (S.dirty && S.dir){ e.preventDefault(); e.returnValue=''; } });
}

initState(); bindGlobal(); renderAll(); renderLog();
</script>
</body>
