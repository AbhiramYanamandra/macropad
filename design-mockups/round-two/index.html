</style><nav aria-label="Design study navigation"><b>macropad / design studies</b><button data-d="1" class="active">01 · Collection</button><button data-d="2">02 · Workbench</button><button data-d="3">03 · Sleeve</button><button class="theme" id="theme">Switch to dark</button></nav><main class="study" data-style="1" id="study"></main><script>

function icon(n){let paths={pencil:'M3 17l1-5L15 1l4 4L8 16z M12 4l4 4',eraser:'M3 12l9-10 7 7-9 10H7z M7 8l7 7 M10 19h11',fill:'M3 9l7-7 9 9-7 7z M2 9h16 M19 14q-4 5 0 6q4-1 0-6',text:'M3 4h16 M11 4v16 M7 20h8',invert:'M11 2a9 9 0 1 0 0 18a9 9 0 0 0 0-18 M11 2v18',import:'M11 14V2 M6 7l5-5 5 5 M3 13v7h16v-7'};return `<svg class="icon" viewBox="0 0 22 22" aria-hidden="true"><path d="${paths[n]}"/></svg>`}
function art(){return `<svg viewBox="0 0 128 32" role="img" aria-label="Monochrome mountain artwork with the words Make something"><g fill="none" stroke="#e5f4f2" stroke-width="1" shape-rendering="crispEdges"><path d="M0 31L20 8l9 10L40 2l27 29M10 20l10-12 7 9M27 18l13-16 9 13M0 27h8m42 4h78"/><path d="M88 5h8m-4-4v8"/></g><g fill="#e5f4f2" font-family="monospace" font-size="7"><text x="65" y="19">MAKE</text><text x="65" y="27">SOMETHING.</text></g></svg>`}
function screen(){return `<div class="oled">${art()}</div>`}
function device(){let a=[['⌘S','Save'],['⇧⌘P','Commands'],['⌘K','Quick link'],['⌘C','Copy'],['⌘V','Paste'],['↗','Open notes'],['⏵','Play / pause'],['⌘Z','Undo'],['→','Next layer']];return `<div class="device" aria-label="Macropad illustration: screen and knob above nine keys"><div class="topdeck">${screen()}<div class="knob" aria-label="Rotary encoder"></div></div><div class="led"></div><div class="keys">${a.map((x,i)=>`<div class="key ${i==1?'selected':''}"><span class="num">0${i+1}</span><strong>${x[0]}</strong><small>${x[1]}</small></div>`).join('')}</div></div>`}
function render(d=1){const el=document.querySelector('#study');el.dataset.style=d;el.innerHTML=`<header class="intro"><div><div class="eyebrow">Direction 0${d} / macOS companion</div><h1>${names[d-1]}</h1></div><p>${desc[d-1]}</p></header><section class="window" aria-label="Editor window design"><div class="titlebar"><div class="dots"><i></i><i></i><i></i></div><strong>macropad</strong><span class="small">/ Abhiram’s pad</span><span class="status right">CIRCUITPY connected</span><span class="btn primary">Save to pad</span></div><div class="workspace"><aside class="sidebar"><h2>Your pad.</h2><div class="small">Nine keys. Your rules.</div><div class="sectionlabel">Your layers <span>＋</span></div><div class="layer active"><em></em><span>Everyday</span><span>01</span></div><div class="layer"><em></em><span>Deep work</span><span>02</span></div><div class="layer"><em></em><span>Afterhours</span><span>03</span></div><div class="small" style="padding:14px 10px">＋ Create layer</div><div class="sectionlabel">Workspace</div><div class="layer">Action library</div><div class="layer">Combos <span>2</span></div><footer class="small">Device settings<br>Import / export</footer></aside><div class="stage"><div class="stagehead"><div><h2>Everyday</h2><div class="small">9 actions · 1 combo · Rename / duplicate ···</div></div><span class="mode">Edit &nbsp; / &nbsp; Try it</span></div><div class="layerstrip"><span>Everyday</span><span>Deep work</span><span>Afterhours</span><span>＋ New layer</span></div>${device()}<div class="caption">Select a key, the knob, or the display to customise it.</div><div class="underdevice"><span>◦ &nbsp; LED · dusty rose</span><span>1 + 3 &nbsp; → &nbsp; Screenshot</span></div></div><aside class="inspector"><div class="inspecthead"><span>KEY 02 / TOP CENTRE</span><span>···</span></div><h2>Command palette</h2><div class="tabs"><span class="on">Tap</span><span>Hold <small>220 ms</small></span></div><div class="fieldlabel">Action type</div><div class="field"><span>Multi-step macro</span><span>⌄</span></div><div class="fieldlabel">Sequence <span style="float:right">3 steps · 100 ms</span></div><div class="step"><span class="grip"><svg class="icon" viewBox="0 0 22 22" aria-hidden="true"><path d="M8 5h.1M14 5h.1M8 11h.1M14 11h.1M8 17h.1M14 17h.1" stroke-width="3"/></svg></span><span class="number">01</span><span>Tap shortcut</span><kbd>⌘S</kbd></div><div class="step"><span class="grip"><svg class="icon" viewBox="0 0 22 22" aria-hidden="true"><path d="M8 5h.1M14 5h.1M8 11h.1M14 11h.1M8 17h.1M14 17h.1" stroke-width="3"/></svg></span><span class="number">02</span><span>Wait</span><span class="delay">100 ms</span></div><div class="step"><span class="grip"><svg class="icon" viewBox="0 0 22 22" aria-hidden="true"><path d="M8 5h.1M14 5h.1M8 11h.1M14 11h.1M8 17h.1M14 17h.1" stroke-width="3"/></svg></span><span class="number">03</span><span>Tap shortcut</span><kbd>⇧⌘P</kbd></div><div class="record"><span class="btn">＋ Add step</span><span class="rec">● Record sequence</span></div><div class="small" style="margin-top:13px">Reorder with drag or move up / down.</div><div class="labelrow"><span>OLED toast</span><kbd>COMMANDS</kbd></div><div class="small" style="margin-top:8px">8 / 10 characters · shown for 1.2 s</div><div class="labelrow"><span>On hold</span><span>Type “/” &nbsp; ↗</span></div></aside></div><div class="bottomline"><span>3 of 8 layers · All names and actions are yours to change</span><span>2 unsaved changes &nbsp; · &nbsp; ⌘S to save</span></div></section><div class="below"><section><h3 class="sceneheading">01 / Menu bar dropdown</h3><div class="mini"><div class="menuos">▦ &nbsp;&nbsp; Sat 21:42</div><div class="menutitle"><strong>Abhiram’s pad</strong><span class="small">USB</span></div>${screen()}<div class="menulayer chosen"><span>Everyday</span><span>✓ &nbsp; ⌘1</span></div><div class="menulayer"><span>Deep work</span><span>⌘2</span></div><div class="menulayer"><span>Afterhours</span><span>⌘3</span></div><div class="menulayer"><strong>Open editor</strong><span>↗</span></div></div></section><section><h3 class="sceneheading">02 / Live preview</h3><div class="mini"><div class="previewtop"><strong>Try your setup</strong><span class="pill">Simulation</span></div><p class="small">Key 02 · Tap → Command palette</p><div class="oled"><svg viewBox="0 0 128 32"><text x="64" y="20" text-anchor="middle" fill="#e5f4f2" font-family="monospace" font-size="13">COMMANDS</text></svg></div><div class="small">LED <span style="color:var(--accent)">●</span> #A33543 &nbsp; · &nbsp; Toast 1.2 s</div><div class="log"><div><span>000 ms</span><b>⌘S</b> &nbsp; tap</div><div><span>000 ms</span>wait 100 ms</div><div><span>100 ms</span><b>⇧⌘P</b> &nbsp; tap</div></div><div class="small" style="margin-top:10px">Output shown here. No keystrokes sent.</div></div></section><section><h3 class="sceneheading">03 / OLED art workspace</h3><div class="mini"><div class="previewtop"><strong>Make it yours.</strong><span class="small">128 × 32 · 1-bit</span></div><div class="tools">${['pencil','eraser','fill','text','invert','import'].map((n,i)=>`<span class="${i==0?'active':''}" title="${n}">${icon(n)}</span>`).join('')}<span title="Browse library">＋</span></div><div class="artcanvas">${screen()}</div><div class="artfoot"><span>mountain.bmp</span><span>Draw / Import + dither / Library</span></div><div class="frames"><span class="pill">Image</span><span class="small">Animation · Information</span><span class="right small">⌄</span></div><div class="future">Animation and information are proposed extensions. This version saves a static BMP and key toasts.</div></div></section></div><div class="rationale"><strong>The design idea</strong><span>${d==1?'A familiar collection sidebar makes layers easy to organise. A restrained cranberry accent gives the workspace character while the grey enclosure and ivory keys stay closest to your hardware.':d==2?'Structure comes first: a narrow layer rail, technical typography, a dotted editing surface and a wider macro inspector. Blue is reserved for selection and primary actions.': 'Layer navigation moves above the device, freeing the canvas. A softly coloured enclosure, angled presentation and editorial type bring the feeling of personal album artwork to a utility.'}</span></div><div class="notice">STATIC DESIGN STUDY · Navigation and theme buttons only change the presentation. Editing, recording, simulation, connection and saving are illustrated states. Layer names are examples. Knob/keycaps are an interpretation of your supplied hardware view.</div>`;document.querySelectorAll('[data-d]').forEach(b=>b.classList.toggle('active',+b.dataset.d===+d))}
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{render(+b.dataset.d);history.replaceState(null,'',`?direction=${b.dataset.d}${document.querySelector('#study').classList.contains('dark')?'&theme=dark':''}`)});document.querySelector('#theme').onclick=()=>{const dark=document.querySelector('#study').classList.toggle('dark');document.querySelector('#theme').textContent=dark?'Switch to light':'Switch to dark'};const q=new URLSearchParams(location.search);render(Math.min(3,Math.max(1,Number(q.get('direction'))||1)));if(q.get('theme')==='dark'){document.querySelector('#study').classList.add('dark');document.querySelector('#theme').textContent='Switch to light'};
